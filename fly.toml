app = 'github-reactions-notifier'
primary_region = 'iad'
# above the server's graceful-shutdown timeout (see apps/backend/express.ts)
kill_timeout = '160s'

[build]
dockerfile = 'Dockerfile'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = false
min_machines_running = 1
processes = ['app']

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1

# same check as the Dockerfile's HEALTHCHECK
[[http_service.checks]]
grace_period = "10s"
interval = "30s"
timeout = "10s"
method = "GET"
path = "/api/status/up"
protocol = "http"

[deploy]
strategy = "bluegreen"
