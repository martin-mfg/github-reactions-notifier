# The `authored` source's incremental discovery for category `issue` (requirements §9.2): its
# three passes side by side, one page each, newest-first, read from the subscribed user.
# Shadow testing: the user is looked up by `$userId`, not as the token's `viewer`, so one
# operator token can scan any account. The alias keeps the response shape of `viewer`.
query authoredDiscovery($userId: ID!) {
  viewer: node(id: $userId) {
    ... on User {
      id
      login
      issues(first: 100, orderBy: { field: CREATED_AT, direction: DESC }) {
        pageInfo {
          hasNextPage
        }
        nodes {
          __typename
          id
          url
          title
          createdAt
          repository {
            nameWithOwner
          }
          author {
            login
            ... on Node {
              id
            }
          }
        }
      }
      pullRequests(
        first: 100
        orderBy: { field: CREATED_AT, direction: DESC }
      ) {
        pageInfo {
          hasNextPage
        }
        nodes {
          __typename
          id
          url
          title
          createdAt
          repository {
            nameWithOwner
          }
          author {
            login
            ... on Node {
              id
            }
          }
        }
      }
      # UPDATED_AT is this connection's only order (C7).
      issueComments(
        first: 100
        orderBy: { field: UPDATED_AT, direction: DESC }
      ) {
        pageInfo {
          hasNextPage
        }
        nodes {
          __typename
          id
          url
          createdAt
          updatedAt
          repository {
            nameWithOwner
          }
          # The thread's title; for a comment on a PR this is the PR's.
          issue {
            title
          }
          author {
            login
            ... on Node {
              id
            }
          }
        }
      }
    }
  }
  rateLimit {
    cost
  }
}
