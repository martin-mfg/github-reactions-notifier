# The `authored` source's incremental discovery for category `issue` (requirements §9.2): its
# three passes side by side, one page each, newest-first, read from `viewer`.
query authoredDiscovery {
  viewer {
    id
    login
    issues(first: 100, orderBy: { field: CREATED_AT, direction: DESC }) {
      pageInfo {
        hasNextPage
      }
      nodes {
        __typename
        id
        url
        title
        createdAt
        repository {
          nameWithOwner
        }
        author {
          login
          ... on Node {
            id
          }
        }
      }
    }
    pullRequests(first: 100, orderBy: { field: CREATED_AT, direction: DESC }) {
      pageInfo {
        hasNextPage
      }
      nodes {
        __typename
        id
        url
        title
        createdAt
        repository {
          nameWithOwner
        }
        author {
          login
          ... on Node {
            id
          }
        }
      }
    }
    # UPDATED_AT is this connection's only order (C7).
    issueComments(first: 100, orderBy: { field: UPDATED_AT, direction: DESC }) {
      pageInfo {
        hasNextPage
      }
      nodes {
        __typename
        id
        url
        createdAt
        updatedAt
        repository {
          nameWithOwner
        }
        # The thread's title; for a comment on a PR this is the PR's.
        issue {
          title
        }
        author {
          login
          ... on Node {
            id
          }
        }
      }
    }
  }
  rateLimit {
    cost
  }
}
